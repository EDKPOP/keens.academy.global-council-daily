<script>
(async () => {
  const msg = document.getElementById('msg');
  const payload = document.getElementById('payload');
  const bytes = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
  const slot = 'keens-daily:' + location.pathname;
  let key = /^#[A-Za-z0-9_-]{43}$/.test(location.hash) ? location.hash.slice(1) : '';
  try {
    if (key) sessionStorage.setItem(slot, key);
    else key = sessionStorage.getItem(slot) || '';
  } catch (e) {}
  try {
    if (!key) throw new Error('no key');
    const k = await crypto.subtle.importKey('raw', bytes(key), 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(payload.dataset.iv) }, k, bytes(payload.textContent));
    const html = new TextDecoder().decode(plain);
    history.replaceState(null, '', location.pathname + location.search);
    const next = new DOMParser().parseFromString(html, 'text/html');
    document.documentElement.replaceWith(document.adoptNode(next.documentElement));
    for (const old of document.querySelectorAll('script')) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      old.replaceWith(s);
    }
  } catch (e) {
    msg.textContent = '이 리포트는 슬랙에 올라온 링크로만 열 수 있습니다.';
  }
})();
</script>
